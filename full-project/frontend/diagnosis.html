<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ParkinSense AI - Diagnosis History</title>

    <!-- Main Stylesheet -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>

<body>

    <!-- ===================================
         Diagnosis Page Container
    ==================================== -->

    <div class="dashboard-container">

        <!-- ===================================
             Top Navigation
        ==================================== -->

        <div class="top-bar">

            <div class="page-title">

                <i class="fa-solid fa-brain"></i>

                <h1>ParkinSense AI</h1>

            </div>

            <button
                onclick="window.location.href='dashboard.html'"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Dashboard

            </button>

        </div>

        <!-- ===================================
             Page Header
        ==================================== -->

        <div class="card">

            <h2>

                <i class="fa-solid fa-stethoscope"></i>

                Diagnosis History

            </h2>

            <p class="sub-text">

                View previous diagnosis results generated from uploaded voice samples.

            </p>

        </div>

        <!-- ===================================
             Diagnosis Records
        ==================================== -->

        <div class="card">

            <table class="audio-table">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Diagnosis</th>

                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="diagnosisTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <!-- Diagnosis Script -->

    <script src="js/diagnosis.js"></script>

</body>

</html>
