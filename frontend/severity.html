<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ParkinSense AI - Severity Score</title>

    <!-- Main Stylesheet -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>

<body>

    <!-- ===================================
         Severity Page Container
    ==================================== -->

    <div class="dashboard-container">

        <!-- ===================================
             Top Navigation
        ==================================== -->

        <div class="top-bar">

            <div class="page-title">

                <i class="fa-solid fa-brain"></i>

                <h1>ParkinSense AI</h1>

            </div>

            <button
                onclick="window.location.href='dashboard.html'"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Dashboard

            </button>

        </div>

        <!-- ===================================
             Severity Card
        ==================================== -->

        <div class="card severity-card">

            <h2>

                <i class="fa-solid fa-chart-line"></i>

                Current Severity Assessment

            </h2>

            <div id="severityContainer">

                <h1 class="severity-score">

                    --

                </h1>

                <p>

                    Severity data unavailable

                </p>

            </div>

        </div>

    </div>

    <!-- Severity Script -->

    <script src="js/severity.js"></script>

</body>

</html>
