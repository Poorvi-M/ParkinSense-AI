<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ParkinSense AI - Login</title>

<!-- Main Stylesheet -->

<link
    rel="stylesheet"
    href="css/style.css"
>

<!-- Font Awesome -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>


</head>

<body>


<!-- ===================================
     Login Container
==================================== -->

<div class="container">

    <!-- Application Title -->

    <h1>

        <i class="fa-solid fa-brain"></i>

        ParkinSense AI

    </h1>

    <!-- Page Title -->

    <h2>

        <i class="fa-solid fa-right-to-bracket"></i>

        Login

    </h2>

    <!-- Login Form -->

    <form id="loginForm">

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
        >

        <button type="submit">

            Login

        </button>

    </form>

    <!-- Status Message -->

    <p id="message"></p>

    <!-- Navigation -->

    <p>

        Don't have an account?

        <a href="register.html">

            Register

        </a>

    </p>

</div>

<!-- Login Script -->

<script src="js/auth.js"></script>


</body>

</html>
