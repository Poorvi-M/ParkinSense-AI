<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ParkinSense AI - Register</title>

    <!-- Main Stylesheet -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>

<body>

    <!-- ===================================
         Registration Container
    ==================================== -->

    <div class="container">

        <!-- Application Title -->

        <h1>

            <i class="fa-solid fa-brain"></i>

            ParkinSense AI

        </h1>

        <!-- Page Title -->

        <h2>

            <i class="fa-solid fa-user-plus"></i>

            Create Account

        </h2>

        <!-- Registration Form -->

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <select id="role">

                <option value="patient">
                    Patient
                </option>

                <option value="doctor">
                    Doctor
                </option>

            </select>

            <button type="submit">

                Register

            </button>

        </form>

        <!-- Status Message -->

        <p id="message"></p>

        <!-- Navigation -->

        <p>

            Already have an account?

            <a href="index.html">

                Login

            </a>

        </p>

    </div>

    <!-- Authentication Script -->

    <script src="js/auth.js"></script>

</body>

</html>
